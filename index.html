(function runFatesSplash(){
  const splash = document.getElementById('splash-fates');
  if (!splash) return;
  // 硬性兜底：不管动画内部发生什么（报错/元素没就绪/浏览器兼容问题），
  // 最多 8 秒后一定强制移除开场动画，绝对不能把用户卡在这一屏进不去。
  let done = false;
  const forceRemove = ()=>{ if (done) return; done = true; splash.remove(); };
  const hardTimeout = setTimeout(forceRemove, 8000);
  try {
    const container = document.getElementById('fates-container');
    const pathL = document.getElementById('path-l');
    const pathR = document.getElementById('path-r');
    const ripple = document.getElementById('ripple');
    const status = document.getElementById('fates-status');
    const brandTitle = document.getElementById('brand-title');
    const lenL = pathL.getTotalLength() || 400;
    const lenR = pathR.getTotalLength() || 400;
    pathL.style.strokeDasharray = lenL; pathL.style.strokeDashoffset = lenL;
    pathR.style.strokeDasharray = lenR; pathR.style.strokeDashoffset = lenR;
    let progress = 0, isStuck = false, hasBroken = false;
    const texts = { 0:"Fates intertwining...", 40:"Tying the knot...", 80:"Pulling tight...", 86:"Through the void...", 95:"Inseparable." };
    function load(){
      try {
        if (progress >= 100){
          container.classList.add('tighten');
          brandTitle.classList.remove('tension'); brandTitle.classList.add('burst');
          status.classList.remove('tension'); status.classList.add('burst');
          status.innerText = "Bound Forever.";
          setTimeout(()=>{
            if (done) return;
            splash.classList.add('splash-exit');
            setTimeout(()=>{ clearTimeout(hardTimeout); forceRemove(); }, 1000);
          }, 1800);
          return;
        }
        let inc = 0, tick = 30;
        if (progress < 60){ inc = Math.random()*2.5+1; tick = 30; }
        else if (progress < 80){ inc = Math.random()*1.5+0.5; tick = 40; }
        else if (progress >= 80 && progress < 85){
          if (!isStuck){ isStuck = true; tick = 800; inc = 0.02; container.classList.add('struggling'); container.classList.add('flattened'); brandTitle.classList.add('tension'); status.classList.add('tension'); }
          else { inc = 0.04; tick = 30; }
        } else if (progress >= 85 && progress < 100){
          if (!hasBroken){ hasBroken = true; container.classList.remove('struggling'); ripple.classList.add('burst'); inc = 4; tick = 20; }
          else { inc = 6; tick = 20; }
        }
        progress = Math.min(progress + inc, 100);
        pathL.style.strokeDashoffset = lenL - (progress/100)*lenL;
        pathR.style.strokeDashoffset = lenR - (progress/100)*lenR;
        if (progress < 100 && !isStuck){
          const keys = Object.keys(texts).map(Number).sort((a,b)=>b-a);
          for (let k of keys){ if (progress >= k){ status.innerText = texts[k]; break; } }
        } else if (isStuck && progress < 85){
          status.innerText = "Pulling tight...";
        }
        setTimeout(load, tick);
      } catch(e){ clearTimeout(hardTimeout); forceRemove(); }
    }
    setTimeout(load, 600);
  } catch(e){ clearTimeout(hardTimeout); forceRemove(); }
})();

let multiSelectMode = false;

function enterMultiSelect(msgId, target) {
  multiSelectMode = true;
  multiSelectTarget = target;

function exitMultiSelect() {

function toggleMultiSelect(msgId) {

  const box = multiSelectTarget === 'chat' ? document.getElementById('chatMessages') : document.getElementById('groupMessages');

    row.classList.toggle('ms-selected', multiSelectSet.has(row.dataset.id));

function makeBlurredBg_v2_unused(dataUrl){
  return new Promise(resolve=>{
    try{
      const img = new Image();
      img.onload = ()=>{
        try{
          const W = 60;
          const H = Math.max(1, Math.round(W * (img.height / img.width)));
          const c = document.createElement('canvas');
          c.width = W; c.height = H;
          c.getContext('2d').drawImage(img, 0, 0, W, H);
          resolve(c.toDataURL('image/jpeg', 0.5));
        }catch(e){ resolve(dataUrl); }
      };
      img.onerror = ()=>resolve(dataUrl);
      img.src = dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}

/* ===== 后台计时补丁：切回前台立刻补跑错过的定时任务 ===== */
(function bgCatchup(){
  // 1) 先停掉原来那 5 个纯 setInterval 定时器
  try { if (proactiveTimer) clearInterval(proactiveTimer); } catch(e){}
  try { if (letterProactiveTimer) clearInterval(letterProactiveTimer); } catch(e){}
  try { if (avatarSwapTimer) clearInterval(avatarSwapTimer); } catch(e){}
  try { if (statusTimer) clearInterval(statusTimer); } catch(e){}
  try { if (autoPostTimer) clearInterval(autoPostTimer); } catch(e){}
  proactiveTimer = letterProactiveTimer = avatarSwapTimer = statusTimer = autoPostTimer = null;

  // 2) 通用心跳：记录上次跑的时间，间隔到了就补跑
  window.__bg = { last:{}, timers:{}, fns:{}, intervals:{} };
  function bgSchedule(key, intervalMs, fn){
    const bg = window.__bg;
    bg.fns[key] = fn;
    bg.intervals[key] = intervalMs;
    if (bg.timers[key]) { clearTimeout(bg.timers[key]); bg.timers[key] = null; }

    const run = () => {
      bg.last[key] = Date.now();
      try { fn(); } catch(e){ console.warn('bg task error', key, e); }
      bg.timers[key] = setTimeout(run, intervalMs);
    };

    const elapsed = Date.now() - (bg.last[key] || 0);
    if (elapsed >= intervalMs){
      // 已经过期，立刻补一次
      run();
    } else {
      bg.timers[key] = setTimeout(run, intervalMs - elapsed);
    }
  }
  window.__bgSchedule = bgSchedule;

  // 3) 覆盖 5 个 setup 函数
  setupProactive = function(){
    if (!state.settings.proactiveEnabled) return;
    bgSchedule('proactive', state.settings.proactiveInterval*60*1000, async ()=>{
      const msg = { id:'m'+Date.now(), from:'partner', text:generateReplyText(), time:Date.now() };
      state.messages.push(msg);
      const sticker = maybeSticker();
      if(sticker) state.messages.push({id:'m'+Date.now()+randInt(0,999), from:'partner', sticker, time:Date.now()+1});
      await saveAll();
      if (document.querySelector('.tab-btn.active')?.dataset.view==='chat') renderChat();
      notify(nameOf('partner')+'想起了你');
    });
  };

  setupLetterProactive = function(){
    if (!state.settings.letterProactiveEnabled) return;
    bgSchedule('letterProactive', state.settings.letterProactiveInterval*60*1000, async ()=>{
      const text = pickCardsWithReplacement(state.settings.letterCardCount);
      const letter = { id:'l'+Date.now(), from:'partner', text, time:Date.now(), status:'received' };
      state.letters.push(letter);
      await saveAll();
      if (document.querySelector('.tab-btn.active')?.dataset.view==='letters') renderLetters();
      const preview = text.length>40 ? text.slice(0,40)+'…' : text;
      showPopup('来自'+nameOf('partner'), preview, 'fa-envelope');
    });
  };

  setupAvatarSwap = function(){
    if (!state.settings.avatarSwapEnabled) return;
    bgSchedule('avatarSwap', state.settings.avatarSwapInterval*60*1000, async ()=>{
      if (state.imageLibrary.length===0) return;
      if (Math.random()*100 >= state.settings.avatarSwapChance) return;
      const pick = ()=> state.imageLibrary[randInt(0,state.imageLibrary.length-1)];
      const roll = Math.random();
      let msg;
      if (roll < 0.34){ state.partner.avatar = pick(); msg = '对方悄悄换了新头像'; }
      else if (roll < 0.6){ state.me.avatar = pick(); msg = '对方把你的头像换了'; }
      else if (roll < 0.8){ state.partner.banner = pick(); msg = '对方换了主页背景图'; }
      else { state.me.avatar = pick(); state.partner.avatar = pick(); msg = '对方把你们俩的头像都换了'; }
      await saveAll();
      renderChat();
      if (document.querySelector('.tab-btn.active')?.dataset.view==='profile') renderProfileTab();
      showPopup('头像更新啦', msg, 'fa-camera');
    });
  };

  setupStatusTimer = function(){
    bgSchedule('status', Math.max(5,state.settings.statusChangeInterval)*60*1000, async ()=>{
      if (state.partnerStatusList.length===0) return;
      state.partner.currentStatus = state.partnerStatusList[randInt(0,state.partnerStatusList.length-1)];
      await saveAll();
      renderStatusTag();
    });
  };

  setupAutoPost = function(){
    if (!state.settings.autoPostEnabled) return;
    bgSchedule('autoPost', state.settings.autoPostInterval*60*1000, async ()=>{
      if (Math.random()*100 >= state.settings.autoPostChance) return;
      const vis = pickRandomVisibility();
const post = { id:'p'+Date.now(), author:'partner', pinned:false, time:Date.now(), text:generateReplyText(), image:maybeSticker()?'':'', sticker:'', replies:[], baseLikes: 0, likedBy:[], ...vis };
      state.posts.push(post);
      await saveAll();
      if (document.querySelector('.tab-btn.active')?.dataset.view==='profile') renderProfileTab();
      notify(nameOf('partner')+'发布了新动态');
    });
  };

  // 4) 页面重新可见时，检查每个任务是否过期，过期就立刻补跑
  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden) return;
    const bg = window.__bg;
    if (!bg) return;
    Object.keys(bg.fns).forEach(key=>{
      const elapsed = Date.now() - (bg.last[key] || 0);
      if (elapsed >= (bg.intervals[key] || 0)){
        if (bg.timers[key]) { clearTimeout(bg.timers[key]); bg.timers[key] = null; }
        bgSchedule(key, bg.intervals[key], bg.fns[key]);
      }
    });
  });

  // 5) 立即用新逻辑启动一遍
  try { setupProactive(); } catch(e){}
  try { setupLetterProactive(); } catch(e){}
  try { setupAvatarSwap(); } catch(e){}
  try { setupStatusTimer(); } catch(e){}
  try { setupAutoPost(); } catch(e){}
})();
/* ===== 后台计时补丁结束 ===== */

  <div class="sheet-btn-row">
    <button onclick="closeSheet()">取消</button>
    <button class="primary" id="musicNeteaseSave">添加</button>
  </div>`, ()=>{

    const titleEl = document.getElementById('musicNeteaseTitle');
    const artistEl = document.getElementById('musicNeteaseArtist');
    const hintEl = document.getElementById('musicNeteaseParseHint');

    const parse = ()=>{
      const raw = rawEl.value.trim();
      if (!raw){ hintEl.textContent = '粘贴后会自动识别歌曲 ID。'; return; }
      const id = extractNeteaseId(raw);
      if (id){
        hintEl.textContent = '已识别网易云歌曲 ID：' + id + '。可以手动填一下歌名和歌手。';
      } else if (isDirectAudioUrl(raw)){
        hintEl.textContent = '识别为音频直链，将直接在本机播放。';
      } else {
        hintEl.textContent = '未识别到歌曲 ID，将按音频直链处理。';
      }
    };
    rawEl.addEventListener('input', parse);
    rawEl.addEventListener('paste', ()=>setTimeout(parse, 0));

    document.getElementById('musicNeteaseSave').onclick = async ()=>{
      const raw = rawEl.value.trim();
      if (!raw) { toast('请先粘贴链接','fa-triangle-exclamation'); return; }
      const id = extractNeteaseId(raw);
      const title = titleEl.value.trim() || '未知歌曲';
      const artist = artistEl.value.trim() || '未知歌手';

      if (id){
        state.playlist.push({
          id: 'song_' + Date.now(),
          title, artist,
          album: '', lyrics: '',
          src: raw, type: 'netease', url: raw, neteaseId: id
        });
      } else {
        state.playlist.push({
          id: 'song_' + Date.now(),
          title, artist,
          album: '', lyrics: '',
          src: raw, type: 'url', url: raw
        });
      }

      closeSheet();
      musicRender();
      saveAll();
      toast('已加入歌单', 'fa-music');
    };
  });
};

/* ===== 背景图补丁 v3：直接同步到聊天消息层，避免仅改 CSS 变量但实际消息区不刷新 ===== */
function applyChatBackground(){
  try {
    const settings = (typeof state !== 'undefined' && state.settings) || {};
    const raw = settings.chatBg || '';
    const bg = raw && typeof _toBlobUrl === 'function' ? (_toBlobUrl(raw) || raw) : raw;
    const op = (()=>{
  const n = Number(settings.chatBgOpacity);
  if (!Number.isFinite(n)) return 1;
  return Math.max(0.05, Math.min(1, n));
})();
    const cssBg = bg ? 'url("' + String(bg).replace(/"/g, '\\"') + '")' : 'none';
    document.documentElement.style.setProperty('--chat-bg-url', cssBg);
    document.documentElement.style.setProperty('--chat-bg-opacity', String(op));
    // 真正把图片放到消息容器本身；伪元素只负责“磨砂/变淡”遮罩。
    // 这样不会再出现“预览换了、聊天区却还是旧背景”的情况。
    document.documentElement.style.setProperty('--chat-bg-overlay-opacity', String(1 - op));
    document.querySelectorAll('.chat-messages, .group-messages').forEach(el=>{
      el.style.setProperty('--chat-bg-url', cssBg);
      el.style.setProperty('--chat-bg-opacity', String(op));
      el.style.setProperty('--chat-bg-overlay-opacity', String(1 - op));
      el.style.backgroundImage = bg ? cssBg : 'none';
      el.style.backgroundSize='cover';
      el.style.backgroundPosition='center';
      el.style.backgroundRepeat='no-repeat';
      el.style.backgroundColor='var(--shell-bg)';
    });
  } catch(e){ console.warn('applyChatBackground error',e); }
}

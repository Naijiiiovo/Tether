<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tether</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tether">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f6f8">
<!-- 引入 FontAwesome v6 CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- 引入 localforage CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

<style>
:root {
  --stage: #12141a;
  --shell-bg: #f5f6f8;
  --ink: #1c1c1e;
  --ink-soft: #4b4f58;
  --muted: #8a8f98;
  --hair: #e7e9ee;
  --card: #ffffff;
  --accent: #3d5cff;
  --accent-soft: #e8ecff;
  --danger: #ff4d5e;
  --gold: #ff9500;
  --font-display: 'Manrope', 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif;
  --font-body: var(--user-font, 'Noto Sans SC', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width:100%; height:100%; min-height:100%; overflow:hidden; margin:0; padding:0; background:var(--shell-bg); }

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-body);
  color: var(--ink);
}

button { font-family: inherit; }
img { -webkit-user-drag: none; }
i { display: inline-flex; align-items: center; justify-content: center; }

/* 全屏容器 */
.phone { width:100vw; height:100dvh; min-height:100%;
  width: 100vw;
  height: 100dvh;
  background: var(--shell-bg);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 灵动岛 */
.notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 28px;
  background: #000000;
  border-radius: 0 0 14px 14px;
  z-index: 50;
  transition: top 0.3s;
}

/* 顶部导航栏 */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 8px;
  background: var(--shell-bg);
  position: sticky;
  top: 0;
  z-index: 20;
  flex: none;
}
.topbar .tb-left { display: flex; align-items: center; gap: 9px; min-width: 0; cursor: pointer; }
.topbar .tb-left img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--accent-soft); flex: none; }
.topbar .tb-text { min-width: 0; }
.topbar h1 { font-family: var(--font-display); font-size: 17px; font-weight: 800; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.topbar .tb-status { font-size: 12px; }
.topbar .tb-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--card); display: flex; align-items: center; justify-content: center; color: var(--ink-soft); cursor: pointer; box-shadow: 0 1px 3px rgba(20,20,30,.08); font-size: 16px; }
.topbar .icon-btn:active { transform: scale(.94); }

/* 视图切换 */
.views { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; padding-bottom: 90px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.view.flexcol { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
.view.hidden { display: none !important; }

/* 底部 Tab */
.tabbar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  display: flex;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--hair);
  padding: 8px 4px calc(10px + env(safe-area-inset-bottom));
}
.tabbar button { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; cursor: pointer; padding: 4px 0; }
.tabbar button i { font-size: 20px; }
.tabbar button.active { color: var(--accent); }

/* 聊天区域 */
.chat-messages { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior-x: none; scrollbar-width: none; padding: 14px 14px 10px; background: var(--shell-bg); background-size: cover; background-position: center; display: flex; flex-direction: column; gap: 4px; }
.chat-messages::-webkit-scrollbar { display: none; }
.chat-sysline { text-align: center; color: var(--muted); font-size: 12px; margin: 10px 0; }
.chat-row { display: flex; gap: 8px; margin: 4px 0; max-width: 100%; touch-action: pan-y; overscroll-behavior-x: none; will-change: transform; }
.chat-row.swiping { transition: none; }
.chat-row:not(.swiping) { transition: transform .2s ease; }
.chat-row.me { flex-direction: row-reverse; }
.chat-row img.cr-ava { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex: none; align-self: flex-start; background: var(--accent-soft); cursor: pointer; }
.chat-row .cr-col { display: flex; flex-direction: column; max-width: 75%; }
.chat-row.me .cr-col { align-items: flex-end; }
.chat-row.partner .cr-col { align-items: flex-start; }

/* 默认气泡样式（可被自定义CSS覆盖） */
.chat-bubble { padding: 10px 14px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; font-size: 15px; }
.chat-bubble.recv { background: #e9e9eb; color: #1c1c1e; border-radius: 4px 16px 16px 16px; }
.chat-bubble.sent { background: #007aff; color: #ffffff; border-radius: 16px 4px 16px 16px; }
.cr-quote { font-size: 11.5px; opacity: .75; border-left: 2px solid currentColor; padding: 2px 0 2px 7px; margin-bottom: 5px; }

.chat-row .cr-img { max-width: 180px; border-radius: 14px; display: block; cursor: pointer; }
.chat-row .cr-video { max-width: 200px; border-radius: 14px; display: block; }
.chat-row .cr-sticker { width: 84px; border-radius: 10px; cursor: pointer; display: block; }
.chat-row .cr-meta { font-size: 11px; color: var(--muted); margin: 4px 4px 0; display: flex; gap: 6px; }
.chat-row .cr-readonly { font-size: 11px; color: var(--muted); padding: 6px 2px; }
.chat-empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; padding: 40px; }
.chat-empty i { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }

/* 红包/转账 */
.chat-bubble.money { display: flex; flex-direction: column; gap: 4px; min-width: 160px; cursor: pointer; border-radius: 18px; }
.chat-bubble.money.envelope { background: linear-gradient(135deg,#ff9a5a,#ff6b6f); color: #fff; }
.chat-bubble.money.envelope.opened { background: linear-gradient(135deg,#ffcda3,#ffb3b6); color: #fff; }
.chat-bubble.money.transfer { background: #fff; color: var(--ink); border: 1px solid var(--hair); }
.chat-bubble.money.transfer.opened { opacity: 0.6; }
.money-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.money-note { font-size: 12px; opacity: 0.9; }
.money-amt { font-size: 22px; font-weight: 800; }
.money-state { font-size: 11px; opacity: 0.85; margin-top: 4px; }

/* 文件 */
.chat-bubble.file { display: flex; align-items: center; gap: 10px; min-width: 160px; cursor: pointer; }
.chat-bubble.file .file-icon { width: 36px; height: 36px; border-radius: 8px; background: rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; flex: none; font-size: 18px; }
.chat-bubble.file .file-name { font-size: 14px; word-break: break-all; }

/* 输入区 */
.chat-composer { flex: none; background: var(--card); border-top: 1px solid var(--hair); position: relative; }
.cc-quote-bar { display: flex; align-items: center; gap: 8px; margin: 8px 12px 0; padding: 7px 10px; background: var(--shell-bg); border-radius: 10px; border-left: 3px solid var(--accent); }
.cc-quote-text { flex: 1; font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-quote-bar button { border: none; background: none; color: var(--muted); cursor: pointer; flex: none; }
.cc-attach { position: relative; margin: 8px 12px 0; display: none; width: fit-content; }
.cc-attach img, .cc-attach video { max-height: 84px; max-width: 160px; border-radius: 10px; display: block; }
.cc-attach .rm { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: #000c; color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.cc-row { display: flex; align-items: flex-end; gap: 6px; padding: 8px 8px calc(78px + env(safe-area-inset-bottom)); }
.cc-icon-btn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: none; background: none; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
.cc-icon-btn.active { background: var(--accent-soft); color: var(--accent); }
.chat-composer textarea { flex: 1; border: 1px solid var(--hair); border-radius: 18px; resize: none; font-size: 15px; font-family: inherit; outline: none; padding: 8px 14px; max-height: 100px; min-height: 36px; background: var(--shell-bg); color: var(--ink); }
.cc-send-btn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--accent); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.cc-send-btn.batch { background: var(--recv-bg); color: var(--ink-soft); }

/* + 面板 */
.cc-plus-panel { display: none; border-top: 1px solid var(--hair); }
.cc-plus-panel.show { display: block; }
.cc-plus-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; padding: 20px 10px; }
.cc-plus-grid .cp-item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); cursor: pointer; }
.cc-plus-grid .cp-item .cp-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--shell-bg); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 22px; }

/* 表情面板 */
.cc-emoji-panel { display: none; border-top: 1px solid var(--hair); height: 240px; flex-direction: column; }
.cc-emoji-panel.show { display: flex; }
.emoji-tabs { display: flex; border-bottom: 1px solid var(--hair); flex: none; }
.emoji-tabs button { flex: 1; border: none; background: none; padding: 10px 0; font-size: 13px; color: var(--muted); cursor: pointer; }
.emoji-tabs button.active { color: var(--accent); font-weight: 700; border-bottom: 2px solid var(--accent); }
.emoji-cats { display: flex; gap: 8px; padding: 8px 10px; overflow-x: auto; flex: none; scrollbar-width: none; }
.emoji-cats::-webkit-scrollbar { display: none; }
.emoji-cats button { flex: none; border: none; background: var(--shell-bg); border-radius: 12px; padding: 6px 12px; font-size: 12px; color: var(--ink-soft); cursor: pointer; }
.emoji-cats button.active { background: var(--accent); color: #fff; }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 10px; overflow-y: auto; flex: 1; }
.emoji-grid.kaomoji { grid-template-columns: repeat(3, 1fr); }
.emoji-grid button { border: none; background: none; font-size: 22px; cursor: pointer; padding: 6px 2px; border-radius: 8px; line-height: 1.2; }
.emoji-grid.kaomoji button { font-size: 14px; }
.emoji-grid button:active { background: var(--accent-soft); }
.emoji-stickers-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px; overflow-y: auto; flex: 1; }
.emoji-stickers-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--card); cursor: pointer; }
.emoji-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 13px; padding: 20px; }

/* 信件 */
.letters-list { flex: 1; overflow-y: auto; scrollbar-width: none; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.letters-list::-webkit-scrollbar { display: none; }
.letter-card { background: var(--card); border-radius: var(--radius-card); padding: 16px; box-shadow: 0 1px 4px rgba(20,20,30,.06); cursor: pointer; }
.letter-head { display: flex; align-items: center; gap: 10px; }
.letter-head img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--accent-soft); }
.letter-who { font-size: 14px; font-weight: 700; }
.letter-time { font-size: 11px; color: var(--muted); }
.letter-body { font-size: 15px; line-height: 1.6; margin: 12px 0 0 46px; white-space: pre-wrap; color: var(--ink); }
.letter-waiting { margin: 12px 0 0 46px; font-size: 13px; color: var(--muted); font-style: italic; display: flex; align-items: center; gap: 6px; }
.letter-reply { margin: 14px 0 0 46px; padding: 12px 14px; background: var(--accent-soft); border-radius: 12px; }
.letter-reply-head { font-size: 12px; color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.letter-reply-body { font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
.letters-bar { flex: none; padding: 12px 16px calc(76px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--hair); }
.letters-bar button { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 16px; padding: 12px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }

/* 动态 / 主页 */
.pf-switch { display: flex; gap: 10px; padding: 14px 16px 0; }
.pf-switch button { flex: 1; border: none; background: var(--card); color: var(--ink-soft); font-size: 14px; font-weight: 700; padding: 10px 0; border-radius: 12px; cursor: pointer; box-shadow: 0 1px 3px rgba(20,20,30,.06); }
.pf-switch button.active { background: var(--accent); color: #fff; }
.pf-banner { height: 140px; background: linear-gradient(135deg, #3d5cff, #7c8cff); position: relative; cursor: pointer; margin-top: 14px; }
.pf-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pf-banner .edit-hint { position: absolute; right: 12px; bottom: 12px; background: rgba(0,0,0,0.6); color: #fff; font-size: 11px; padding: 6px 10px; border-radius: 8px; display: flex; align-items: center; gap: 6px; }
.pf-head { padding: 0 16px; margin-top: -36px; position: relative; }
.pf-avatar { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--shell-bg); object-fit: cover; background: var(--accent-soft); cursor: pointer; display: block; }
.pf-actions { display: flex; justify-content: flex-end; margin-top: -32px; }
.pf-follow-btn { background: var(--ink); color: #fff; border: none; border-radius: 18px; padding: 8px 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
.pf-name-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.pf-name { font-family: var(--font-display); font-size: 20px; font-weight: 800; }
.pf-status-tag { font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 12px; cursor: pointer; }
.pf-id { color: var(--muted); font-size: 14px; margin-top: 2px; }
.pf-bio { font-size: 14.5px; margin-top: 10px; line-height: 1.5; }
.pf-since { color: var(--muted); font-size: 13px; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.pf-stats { display: flex; gap: 20px; margin-top: 10px; font-size: 14px; }
.pf-stats b { color: var(--ink); } .pf-stats span { color: var(--muted); }
.pf-tabs { display: flex; border-bottom: 1px solid var(--hair); margin-top: 16px; position: sticky; top: 0; background: var(--shell-bg); z-index: 5; }
.pf-tabs div { flex: 1; text-align: center; padding: 12px 0; font-size: 14px; color: var(--muted); position: relative; cursor: pointer; }
.pf-tabs div.active { color: var(--ink); font-weight: 700; }
.pf-tabs div.active::after { content: ''; position: absolute; bottom: -1px; left: 35%; right: 35%; height: 3px; background: var(--accent); border-radius: 2px; }
.mini-toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; font-size: 14px; padding: 10px 18px; border-radius: 20px; z-index: 200; opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; max-width: 80%; }
.mini-toast.show { opacity: 1; }
.pf-fab { position: absolute; right: 20px; bottom: calc(76px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; border: none; box-shadow: 0 8px 20px rgba(61,92,255,.4); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 15; font-size: 24px; }

.feed { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.post { background: var(--card); border-radius: var(--radius-card); padding: 14px 16px; box-shadow: 0 1px 4px rgba(20,20,30,.06); }
.post .phead { display: flex; gap: 10px; align-items: center; }
.post .phead img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--accent-soft); }
.post .phead .who { font-size: 14.5px; font-weight: 700; }
.post .phead .when { font-size: 12px; color: var(--muted); }
.post .pin-tag { font-size: 11.5px; color: var(--accent); display: flex; align-items: center; gap: 4px; margin-left: auto; }
.post .ptext { font-size: 15.5px; line-height: 1.55; margin: 10px 0 0 50px; white-space: pre-wrap; }
.post .pimg { margin: 10px 0 0 50px; max-width: calc(100% - 50px); border-radius: 12px; max-height: 240px; object-fit: cover; cursor: pointer; display: block; }
.post .pfoot { display: flex; gap: 24px; margin: 12px 0 0 50px; color: var(--muted); font-size: 13px; }
.post .pfoot span { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.post .pfoot span.liked { color: var(--danger); }
.post .reply-context { margin: 0 0 8px 50px; font-size: 12.5px; color: var(--muted); }
.reply-block { margin: 12px 0 0 50px; padding-top: 12px; border-top: 1px solid var(--hair); display: flex; gap: 10px; align-items: flex-start; }
.reply-block img.ava { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; background: var(--accent-soft); }
.reply-block img.psticker { width: 84px; border-radius: 10px; display: block; cursor: pointer; }
.bubble { border-radius: var(--radius-bubble); padding: 10px 14px; line-height: 1.4; max-width: 100%; font-size: 14.5px; }
.bubble.recv { background: var(--recv-bg); color: var(--recv-ink); border-radius: 16px 16px 16px 4px; }
.bubble.sent { background: var(--sent-bg); color: var(--sent-ink); border-radius: 16px 16px 4px 16px; }
.reply-meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.reply-input-row { margin: 12px 0 0 50px; display: flex; gap: 8px; }
.reply-input-row input { flex: 1; border: 1px solid var(--hair); border-radius: 16px; padding: 8px 14px; font-size: 13.5px; font-family: inherit; }
.reply-input-row button { border: none; background: var(--accent); color: #fff; border-radius: 16px; padding: 8px 16px; font-size: 13px; cursor: pointer; }

.empty-state { text-align: center; color: var(--muted); font-size: 14px; padding: 60px 20px; }
.empty-state i { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }

/* 设置 */
.settings-group { margin: 16px; background: var(--card); border-radius: var(--radius-card); overflow: hidden; box-shadow: 0 1px 4px rgba(20,20,30,.06); }
.settings-group h3 { font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; margin: 0; padding: 14px 16px 6px; font-weight: 700; }
.settings-save-bar { position: sticky; top: 0; z-index: 30; margin: 0 0 4px; padding: 10px 16px; background: rgba(255,255,255,.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--hair); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.settings-save-bar span { font-size: 11.5px; color: var(--muted); }
.settings-save-bar button { background: var(--accent); color: #fff; border: none; border-radius: 14px; padding: 8px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--hair); gap: 12px; }
.setting-row:first-of-type { border-top: none; }
.setting-row .label { font-size: 14.5px; }
.setting-row .label small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
.setting-row input[type=range] { width: 110px; accent-color: var(--accent); }
.setting-row input[type=number] { width: 80px; border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
.setting-row .unit { font-size: 13px; color: var(--muted); }
.setting-row .val { font-size: 13px; color: var(--muted); min-width: 36px; text-align: right; }
.setting-row input[type=text] { border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; font-size: 14px; width: 130px; font-family: inherit; }
.setting-row textarea { border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; width: 100%; font-family: inherit; }
.setting-row .mini { border: 1px solid var(--hair); background: var(--card); border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
.setting-row .mini.danger { color: var(--danger); border-color: #ffd7db; }
.setting-row .mini.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.switch { position: relative; width: 46px; height: 26px; flex: none; }

/* 旧的开场动画已彻底移除，不再保留任何相关规则，避免和新动画产生任何冲突 */
#splash-fates{position:absolute;inset:0;background:radial-gradient(circle at center,#140000 0%,#050000 100%);z-index:1200;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 1s ease;}
#splash-fates.splash-exit{opacity:0;pointer-events:none;}
#splash-fates .brand-title{position:absolute;top:20%;font-family:var(--font-display,-apple-system,sans-serif);font-size:24px;font-weight:300;letter-spacing:16px;color:#fff;text-transform:uppercase;opacity:.8;text-shadow:0 0 20px rgba(230,0,0,.7);transition:letter-spacing 4s ease-in-out,transform 4s ease-in-out,opacity 4s ease-in-out,text-shadow 4s ease-in-out,filter 4s ease-in-out;}
#splash-fates .brand-title.tension{letter-spacing:2px;transform:scale(.95) translateY(10px);opacity:.5;text-shadow:-2px 0 5px rgba(255,0,0,.8),2px 0 5px rgba(0,255,255,.5);filter:blur(.5px);}
#splash-fates .brand-title.burst{transition:all .4s cubic-bezier(.175,.885,.32,1.275);letter-spacing:24px;transform:scale(1.1) translateY(0);opacity:1;font-weight:700;text-shadow:0 0 30px #e60000,0 0 60px #ff0000;filter:blur(0);}
#splash-fates .fates-container{position:relative;width:min(400px,84vw);height:200px;display:flex;justify-content:center;align-items:center;}
#splash-fates .node{position:absolute;width:8px;height:8px;background:#fff;border-radius:50%;top:50%;margin-top:-4px;box-shadow:0 0 20px 6px #e60000;transition:transform .6s cubic-bezier(.7,-.3,.1,1.4),opacity .3s;z-index:10;}
#splash-fates .node-left{left:40px;}
#splash-fates .node-right{right:40px;}
#splash-fates svg{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;transition:transform .5s cubic-bezier(.8,0,.2,1),opacity .4s .1s,filter 4s ease-in-out;}
#splash-fates .fate-path{fill:none;stroke:#e60000;stroke-width:2.5;stroke-linecap:round;filter:drop-shadow(0 0 8px #e60000);transition:d 4s ease-in-out,stroke-dashoffset .15s linear;mix-blend-mode:screen;}
#splash-fates .fates-container.flattened #path-l{d:path("M 40 100 C 160 100, 185 96, 200 96 C 215 96, 215 104, 200 104 C 185 104, 185 100, 200 100 C 215 100, 240 100, 360 100");}
#splash-fates .fates-container.flattened #path-r{d:path("M 360 100 C 240 100, 215 104, 200 104 C 185 104, 185 96, 200 96 C 215 96, 215 100, 200 100 C 185 100, 160 100, 40 100");}
#splash-fates .fates-container.flattened svg{filter:drop-shadow(0 0 15px #e60000) brightness(1.4);}
@keyframes tetherStruggleShake{0%{transform:translate(0,0);}25%{transform:translate(-1px,1px);}50%{transform:translate(1px,-1px);}75%{transform:translate(-1px,-1px);}100%{transform:translate(1px,1px);}}
#splash-fates .fates-container.struggling .node{animation:tetherStruggleShake .1s infinite;box-shadow:0 0 30px 10px #e60000;}
#splash-fates .fates-container.struggling svg{animation:tetherStruggleShake .1s infinite;}
#splash-fates .barrier-ripple{position:absolute;top:50%;left:50%;width:20px;height:20px;border:2px solid #e60000;border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:0;z-index:5;}
#splash-fates .barrier-ripple.burst{animation:tetherRippleBurst .6s ease-out forwards;}
@keyframes tetherRippleBurst{0%{transform:translate(-50%,-50%) scale(1);opacity:1;border-width:4px;box-shadow:0 0 20px #e60000;}100%{transform:translate(-50%,-50%) scale(12);opacity:0;border-width:0;box-shadow:0 0 0 #e60000;}}
#splash-fates .fates-container.tighten .node-left{transform:translateX(156px) scale(1.5);}
#splash-fates .fates-container.tighten .node-right{transform:translateX(-156px) scale(1.5);}
#splash-fates .fates-container.tighten svg{transform:scaleX(.05) scaleY(.2);opacity:0;}
#splash-fates .burst-knot{position:absolute;top:50%;left:50%;width:12px;height:12px;background:#fff;border-radius:50%;transform:translate(-50%,-50%) scale(0);box-shadow:0 0 50px 25px #e60000,0 0 100px 40px #ff0000;opacity:0;transition:transform .6s cubic-bezier(.175,.885,.32,1.275),opacity .6s;z-index:20;}
#splash-fates .fates-container.tighten .burst-knot{transform:translate(-50%,-50%) scale(1);opacity:1;}
#splash-fates .status-text{position:absolute;bottom:20%;font-family:var(--font-display,-apple-system,sans-serif);font-size:11px;letter-spacing:6px;color:rgba(255,255,255,.6);text-transform:uppercase;font-weight:300;transition:letter-spacing 4s ease-in-out,transform 4s ease-in-out,color .3s,text-shadow .3s;}
#splash-fates .status-text.tension{letter-spacing:1px;transform:translateY(-10px);color:rgba(255,16,83,.8);animation:tetherStruggleShake .1s infinite;}
#splash-fates .status-text.burst{transition:all .4s cubic-bezier(.175,.885,.32,1.275);letter-spacing:10px;transform:translateY(0);color:#fff!important;text-shadow:0 0 15px #e60000;font-weight:600!important;animation:none;}
.settings-category-nav{position:sticky;top:0;z-index:30;display:flex;gap:6px;padding:8px 10px;margin:0 -2px 10px;background:rgba(245,247,252,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}.settings-category-nav::-webkit-scrollbar{display:none}.settings-category-nav button{flex:0 0 auto;border:1px solid var(--hair);background:rgba(255,255,255,.58);color:var(--muted);border-radius:13px;padding:8px 12px;font:inherit;font-size:11px;white-space:nowrap}.settings-category-nav button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.settings-group[data-setting-cat][hidden]{display:none!important}.music-setting-actions .mini{min-height:36px}.music-settings-row{grid-template-columns:minmax(0,1fr) minmax(118px,1.15fr)}.music-range-wrap input[type=number]{width:62px;box-sizing:border-box}.music-track-setting{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--hair);border-radius:13px;background:rgba(255,255,255,.42)}.music-track-setting .track-setting-info{min-width:0;flex:1}.music-track-setting .track-setting-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.music-track-setting .track-setting-artist{font-size:10px;color:var(--muted);margin-top:2px}.music-track-setting .mini{flex:none}.music-alert{margin:8px auto;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.72);font-size:11px;color:var(--accent);text-align:center}
</style>

function normalizeChatMediaMessages(){
  if(!Array.isArray(state.messages)) return;
  const out=[]; let changed=false;
  state.messages.forEach(m=>{
    if(m && m.text && m.sticker){
      const baseTime=Number(m.time)||Date.now();
      const textMsg={...m}; delete textMsg.sticker; textMsg.id=String(m.id)+'_text'; textMsg.time=baseTime;
      const stickerMsg={...m}; delete stickerMsg.text; delete stickerMsg.quote; stickerMsg.id=String(m.id)+'_sticker'; stickerMsg.time=baseTime+1;
      out.push(textMsg,stickerMsg); changed=true;
    }else out.push(m);
  });
  if(changed){ state.messages=out.sort((a,b)=>(a.time||0)-(b.time||0)); saveAll(); }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function fmtTime(ts){
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
  if (sameDay) return `${hh}:${mm}`;
  return `${d.getMonth()+1}月${d.getDate()}日 ${hh}:${mm}`;
}
function rand(min,max){ return Math.random()*(max-min)+min; }
function randInt(min,max){ return Math.floor(rand(min,max+1)); }
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
// 图片压缩逻辑
function compressImage(file, maxWidth = 800) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round((maxWidth / w) * h); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL(file.type || 'image/jpeg', 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

      showLoading('处理中...');
      let url;

      dismiss(); onPick(url); input.value='';

      if(url && url.trim()) onPick(url.trim());
    }, 300);
  };
}

function generateReplyText(){
  if (state.cards.length===0) return '（字卡库是空的，去设置里添加一些吧）';
  let text;
  if (!state.settings.concatEnabled){
    text = state.cards[randInt(0, state.cards.length-1)];
  } else {
    const n = Math.min(Math.max(1, state.settings.maxConcat||1), state.cards.length);
    const count = randInt(1, n);
    const pool = [...state.cards];
    const picked = [];
    for (let i=0; i<count; i++){
      const idx = randInt(0, pool.length-1);
      picked.push(pool[idx]);
      pool.splice(idx,1);
    }
    text = picked.join('，');
  }
  return maybeDecorateWithEmoji(text);
}
function maybeDecorateWithEmoji(text){
  const decorPool = [...state.kaomoji, ...EMOJI_CATEGORIES.flatMap(c=>c.list)];
  if (decorPool.length && Math.random() < 0.25){
    text += decorPool[randInt(0,decorPool.length-1)];
  }
  return text;
}
function pickCardsWithReplacement(n){
  if (state.cards.length===0) return '（字卡库是空的，去设置里添加一些吧）';
  const arr = [];
  for (let i=0;i<n;i++) arr.push(state.cards[randInt(0, state.cards.length-1)]);
  return maybeDecorateWithEmoji(arr.join('，'));
}
function maybeSticker(){
  if (state.stickers.length===0) return '';
  if (Math.random()*100 < state.settings.stickerChance) return state.stickers[randInt(0, state.stickers.length-1)];
  return '';
}
function pickSpecialOrRandomAmount(maxBalance){
  const affordableSpecial = SPECIAL_MONEY_AMOUNTS.filter(a=>a<=maxBalance);
  if (affordableSpecial.length && Math.random()<0.5) return affordableSpecial[randInt(0,affordableSpecial.length-1)];
  const cap = Math.max(1, Math.min(maxBalance, 200));
  return randInt(1, cap);
}

let lastRenderedMsgCount = 0;
function renderChat(animateCount=0){
  const pn = document.getElementById('topbarTitle');
  if (pn) pn.textContent = nameOf('partner');
  const av = document.getElementById('topbarAvatar');
  if (av) av.src = avatarOf('partner');
  renderStatusTag();
  setTopbarSub();
  const box = document.getElementById('chatMessages');
  if (!box) return;
  if (state.messages.length===0){
    box.innerHTML = `<div class="chat-empty"><i class="fa-solid fa-comment-dots"></i><div>还没有消息，说点什么吧</div></div>`;
    lastRenderedMsgCount = 0;
    return;
  }
  const frag = document.createDocumentFragment();
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = state.messages.map(msgHTML).join('');
  while(tempDiv.firstChild) frag.appendChild(tempDiv.firstChild);
  box.innerHTML = '';
  box.appendChild(frag);
  // 自动检测这次比上次多了几条消息，比手工传参更可靠——不会再漏掉动画
  const autoCount = Math.max(0, state.messages.length - lastRenderedMsgCount);
  const effectiveCount = Math.max(animateCount, autoCount);
  if (effectiveCount > 0) {
    const rows = box.querySelectorAll('.chat-row, .chat-sysline');
    const start = Math.max(0, rows.length - effectiveCount);
    for (let i = start; i < rows.length; i++) {
      rows[i].classList.add('msg-enter');
      rows[i].style.animationDelay = ((i - start) * 0.05) + 's';
    }
  }
  lastRenderedMsgCount = state.messages.length;
  scrollChatToBottom();
}
function scrollChatToBottom(){
  const box = document.getElementById('chatMessages');
  if (!box) return;

  const force = ()=>{
    box.scrollTop = Math.max(0, box.scrollHeight - box.clientHeight);
  };

  force();
  requestAnimationFrame(()=>{
    force();
    requestAnimationFrame(()=>{
      force();
      setTimeout(force, 40);
      setTimeout(force, 160);
    });
  });

  // 图片/视频尺寸异步确定后，避免媒体消息把底部顶开。
  box.querySelectorAll('img,video').forEach(el=>{
    if (!el.complete || (el.tagName==='VIDEO' && !el.readyState)){
      el.addEventListener('load', force, {once:true});
      el.addEventListener('loadedmetadata', force, {once:true});
    }
  });
}
function msgHTML(m){
  if (m.sysline) return `<div class="chat-sysline">${escapeHTML(m.sysline)}</div>`;
  if (m.recalled) return `<div class="chat-sysline">${m.from==='me'?'你':escapeHTML(nameOf('partner'))}撤回了一条消息</div>`;
  const rowClass = m.from==='me' ? 'me' : 'partner';
  let inner = '';
  const quoteHtml = m.quote ? `<div class="cr-quote">${escapeHTML(nameOf(m.quote.from))}：${escapeHTML(m.quote.text.length>28?m.quote.text.slice(0,28)+'…':m.quote.text)}</div>` : '';
  if (m.money){
    const mm = m.money;
    const isEnvelope = mm.type==='envelope';
    let stateLabel = '';
    if(mm.returned) {
      stateLabel = '已退回';
    } else if(mm.opened) {
      stateLabel = isEnvelope ? '已领取' : '已收款';
    } else {
      stateLabel = isEnvelope ? (mm.from==='me'?'等待对方领取':'点击领取') : (mm.from==='me'?'等待对方确认':'点击确认收款');
    }
    const openedClass = (mm.opened || mm.returned) ? 'opened' : '';
    inner = `<div class="chat-bubble money ${isEnvelope?'envelope':'transfer'} ${openedClass}" data-mid="${m.id}">
      <div class="money-head"><i class="fa-solid ${isEnvelope?'fa-gift':'fa-money-bill-wave'}"></i>${isEnvelope?'红包':'转账'}</div>
      ${mm.note ? `<div class="money-note">${escapeHTML(mm.note)}</div>` : ''}
      <div class="money-amt">¥${mm.amount}</div>
      <div class="money-state">${stateLabel}</div>
    </div>`;
  } else if (m.file){
    inner = `<div class="chat-bubble file ${m.from==='me'?'sent':'recv'}" data-mid="${m.id}">
      <div class="file-icon"><i class="fa-solid fa-file"></i></div>
      <div class="file-name">${escapeHTML(m.file.name)}</div>
    </div>`;
  } else {
    const parts = [];
    if (m.image) parts.push(`<img class="cr-img" src="${m.image}" data-imgzoom="${m.image}">`);
    if (m.video) parts.push(`<video class="cr-video" controls src="${m.video}"></video>`);
    if (m.sticker) parts.push(`<img class="cr-sticker" src="${m.sticker}" data-imgzoom="${m.sticker}">`);
    if (m.text) parts.push(`<div class="chat-bubble ${m.from==='me'?'sent':'recv'}">${quoteHtml}${escapeHTML(m.text)}</div>`);
    inner = parts.join('');
  }
  const meta = [];
  if (!m.readOnly) meta.push(fmtTime(m.time));
  if (m.from==='me' && !m.money && !m.file) meta.push(m.readStatus==='read' ? '已读' : '未读');
  
  let readOnlyHtml = m.readOnly ? `<div class="cr-readonly"><i class="fa-solid fa-eye"></i> 对方已读</div>` : '';

  return `<div class="chat-row ${rowClass}" data-id="${m.id}">
    <img class="cr-ava" src="${avatarOf(m.from)}" data-from="${m.from}">
    <div class="cr-col">${inner}${readOnlyHtml}<div class="cr-meta">${meta.join(' · ')}</div></div>
  </div>`;
}

/* 委托事件：图片放大 / 红包转账 / 文件下载 / 双击头像拍一拍——只绑定一次，避免消息一多每次全量重绑变卡 */
(function setupChatDelegatedEvents(){
  const box = document.getElementById('chatMessages');
  box.addEventListener('click', async e=>{
    const img = e.target.closest('[data-imgzoom]');
    if (img){ openImgViewer(img.dataset.imgzoom); return; }
    const moneyBubble = e.target.closest('.chat-bubble.money');
    if (moneyBubble){
      const id = moneyBubble.dataset.mid;
      const msg = state.messages.find(mm=>mm.id===id);
      if (!msg || !msg.money || msg.money.opened || msg.money.returned) return;
      if (msg.money.from==='me') return;
      msg.money.opened = true;
      state.me.balance += msg.money.amount;
      await saveAll(); renderChat(); renderSettings();
      toast(`收到 ¥${msg.money.amount}`, 'fa-money-bill-wave');
      return;
    }
    const fileBubble = e.target.closest('.chat-bubble.file');
    if (fileBubble){
      const id = fileBubble.dataset.mid;
      const msg = state.messages.find(mm=>mm.id===id);
      if (!msg || !msg.file) return;
      const a = document.createElement('a');
      a.href = msg.file.data; a.download = msg.file.name; a.click();
      return;
    }
  });
  box.addEventListener('dblclick', e=>{
    const ava = e.target.closest('.cr-ava[data-from="partner"]');
    if (ava) sendPoke();
  });
})();

/* 长按消息：引用 / 撤回；左滑消息：丝滑引用 */
(function setupLongPressMessage(){
  const box = document.getElementById('chatMessages');
  if (!box) return;

  let pressTimer = null, pressedRow = null;
  let startX = 0, startY = 0, tracking = false, swiping = false, quoteReady = false;

  const resetRow = (row)=>{
    if (!row) return;
    row.classList.remove('swiping');
    row.style.transform = '';
  };

  const clearPress = (keepRow=false)=>{
    if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
    if (pressedRow && swiping) resetRow(pressedRow);
    if (!keepRow) pressedRow = null;
    tracking = false;
    swiping = false;
    quoteReady = false;
  };

  box.addEventListener('pointerdown', e=>{
    if (e.isPrimary === false) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const row = e.target.closest('.chat-row');
    if (!row || !row.dataset.id) return;

    clearPress();
    pressedRow = row;
    startX = e.clientX;
    startY = e.clientY;
    tracking = true;

    // 抢到指针后，避免浏览器在消息区域把手势当成页面横向导航。
    try { row.setPointerCapture?.(e.pointerId); } catch (_) {}

    pressTimer = setTimeout(()=>{
      if (!tracking || swiping || !pressedRow) return;
      if (navigator.vibrate) navigator.vibrate(15);
      openMessageActionSheet(pressedRow.dataset.id);
      pressTimer = null;
    }, 480);
  }, {passive:true});

  box.addEventListener('pointermove', e=>{
    if (!tracking || !pressedRow || e.isPrimary === false) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (!swiping){
      // 竖向滑动：立刻交还给原生滚动。
      if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx) * 1.05){
        clearPress();
        return;
      }

      // 只有向左才进入引用手势；阈值稍低，手机上更容易触发。
      if (dx < -8 && Math.abs(dx) > Math.abs(dy) * 1.05){
        swiping = true;
        if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
        pressedRow.classList.add('swiping');
        try { pressedRow.setPointerCapture?.(e.pointerId); } catch (_) {}
      } else {
        return;
      }
    }

    // 一旦确定是左滑，就阻止页面接管横向手势；竖向滚动仍保持原生体验。
    if (e.cancelable) e.preventDefault();

    const raw = Math.max(-88, Math.min(0, dx));
    const distance = Math.abs(raw);
    const eased = distance <= 52 ? raw : -52 - (distance - 52) * 0.28;
    pressedRow.style.transform = `translate3d(${eased}px,0,0)`;
    quoteReady = distance >= 42;
  }, {passive:false});

  const finishGesture = (e)=>{
    if (!pressedRow || e?.isPrimary === false) return;
    const row = pressedRow;
    const id = row.dataset.id;
    const shouldQuote = swiping && quoteReady;

    try { row.releasePointerCapture?.(e.pointerId); } catch (_) {}
    resetRow(row);
    clearPress();

    if (shouldQuote){
      const msg = state.messages.find(m=>m.id===id);
      if (msg && !msg.sysline && !msg.recalled) setQuote(msg);
    }
  };

  box.addEventListener('pointerup', finishGesture, {passive:true});
  box.addEventListener('pointercancel', e=>{
    if (pressedRow) {
      try { pressedRow.releasePointerCapture?.(e.pointerId); } catch (_) {}
    }
    clearPress();
  }, {passive:true});

  // pointerleave 不再直接取消：有 pointer capture 时，手指移出消息行仍可正常完成引用。
  box.addEventListener('pointerout', e=>{
    if (!pressedRow || !swiping) return;
    if (e.relatedTarget && pressedRow.contains(e.relatedTarget)) return;
  }, {passive:true});
})();

function markMyMessagesRead(){
  let changed = false;
  state.messages.forEach(m=>{ if (m.from==='me' && m.readStatus==='unread'){ m.readStatus='read'; changed=true; } });
  return changed;
}
function triggerChatReply(){
  const chance = state.settings.readNoReply ? (100 - state.settings.noReplyChance) : 100;
  const willReply = Math.random()*100 < chance;
  const delayMs = randInt(state.settings.minDelay, state.settings.maxDelay) * 1000;

  if (!willReply){
    setTimeout(async ()=>{
      markMyMessagesRead();
      // 不单独发消息，仅标记已读
      await saveAll(); renderChat();
    }, Math.min(delayMs, 2500));
    return;
  }
  partnerTyping = true; setTopbarSub();
  setTimeout(async ()=>{
    markMyMessagesRead();
    partnerTyping = false;
    // 小概率改为发红包/转账，而不是普通文字
    const roll = Math.random()*100;
    let finalMsg;
    if (roll < state.settings.redEnvelopeChance && state.partner.balance > 0){
      const amt = pickSpecialOrRandomAmount(state.partner.balance);
      state.partner.balance -= amt;
      finalMsg = { id:'m'+Date.now(), from:'partner', money:{type:'envelope', amount:amt, note:generateReplyText(), opened:false, from:'partner'}, time:Date.now() };
    } else if (roll < state.settings.redEnvelopeChance + state.settings.transferChance && state.partner.balance > 0){
      const amt = pickSpecialOrRandomAmount(state.partner.balance);
      state.partner.balance -= amt;
      finalMsg = { id:'m'+Date.now(), from:'partner', money:{type:'transfer', amount:amt, opened:false, from:'partner'}, time:Date.now() };
    } else {
      finalMsg = { id:'m'+Date.now(), from:'partner', text:generateReplyText(), time:Date.now() };
      const sticker = maybeSticker();
      state.messages.push(finalMsg);
      if (sticker) state.messages.push({id:'m'+Date.now()+randInt(0,999), from:'partner', sticker, time:Date.now()+1});
    }
    if (!state.messages.some(m=>m.id===finalMsg.id)) state.messages.push(finalMsg);
    await saveAll(); renderChat(1);
    notify(nameOf('partner')+'：'+ (finalMsg.text || (finalMsg.money?'[发来了红包/转账]':'[消息]')));

    // 对方可能连续发送多条消息（与字卡拼接是两回事）
    const isMoneyMsg = !!finalMsg.money;
    if (!isMoneyMsg && state.settings.multiMsgEnabled){
      const lo = Math.max(1, Math.min(state.settings.multiMsgMin, state.settings.multiMsgMax));
      const hi = Math.max(state.settings.multiMsgMin, state.settings.multiMsgMax);
      const extra = randInt(lo, hi) - 1;
      for (let i=0;i<extra;i++){
        await new Promise(r=> setTimeout(r, randInt(600,1500)));
        const msg2 = { id:'m'+Date.now()+i+1, from:'partner', text:generateReplyText(), time:Date.now() };
        state.messages.push(msg2);
        const sticker2 = maybeSticker(); if(sticker2) state.messages.push({id:'m'+Date.now()+i+2, from:'partner', sticker:sticker2, time:Date.now()+1});
        await saveAll(); renderChat(1);
      }
    }
  }, delayMs);
}

function triggerMoneyReplyReaction(msgId){
  const delayMs = randInt(state.settings.minDelay, state.settings.maxDelay) * 1000;
  setTimeout(async ()=>{
    const msg = state.messages.find(m=>m.id===msgId);
    if (msg && msg.money && !msg.money.opened && !msg.money.returned){
      const chance = msg.money.type === 'envelope' ? state.settings.redEnvelopeAcceptChance : state.settings.transferAcceptChance;
      const willAccept = Math.random() * 100 < chance;
      if(willAccept) {
        msg.money.opened = true;
        state.partner.balance += msg.money.amount;
      } else {
        msg.money.returned = true;
        state.me.balance += msg.money.amount;
      }
    }
    await saveAll(); renderChat(); renderSettings();
  }, delayMs);
}

    <button class="call-btn end" id="callEndBtn"><div class="icon-circle"><i class="fa-solid fa-phone-slash"></i></div>挂断</button>
    <div style="flex:1"></div>`;
  showCallScreen();
  document.getElementById('callEndBtn').onclick = ()=> endCall('已挂断');
  updateCallPill();
  setTimeout(()=>{
    if (callState !== 'outgoing') return;
    const willAccept = Math.random()*100 < state.settings.callAcceptChance;
    if (willAccept) acceptCall(); else endCall('对方未接听');
  }, randInt(2,4)*1000);
}
function acceptCall(){
  callState = 'active';
  document.getElementById('callStatus').textContent = callIsVideo ? '视频通话中' : '通话中';
  document.getElementById('callTimer').style.display='block';
  document.getElementById('callActions').innerHTML = `
    <div style="flex:1"></div>
    <button class="call-btn end" id="callEndBtn"><div class="icon-circle"><i class="fa-solid fa-phone-slash"></i></div>挂断</button>
    <div style="flex:1"></div>`;
  document.getElementById('callEndBtn').onclick = ()=> endCall('通话结束');
  document.getElementById('callScreen').classList.toggle('video-bg', callIsVideo);
  if (callIsVideo) document.getElementById('callScreen').style.backgroundImage = callBg ? `url("${callBg}")` : '';
  callSeconds = 0;
  callTimerInterval = setInterval(()=>{
    callSeconds++;
    const mm = String(Math.floor(callSeconds/60)).padStart(2,'0'), ss = String(callSeconds%60).padStart(2,'0');
    document.getElementById('callTimer').textContent = `${mm}:${ss}`;
    updateCallPill();
  },1000);
  updateCallPill();
}
function endCall(statusMsg){
  const wasActive = callState === 'active';
  callState = 'idle';
  if (callTimerInterval){ clearInterval(callTimerInterval); callTimerInterval=null; }
  if (wasActive && callSeconds > 0){
    const mm = String(Math.floor(callSeconds/60)).padStart(2,'0'), ss = String(callSeconds%60).padStart(2,'0');
    statusMsg = `${statusMsg} ${mm}:${ss}`;
  }
  document.getElementById('callStatus').textContent = statusMsg;
  setTimeout(()=>{ document.getElementById('callScreen').classList.remove('show','video-bg'); document.getElementById('callScreen').style.backgroundImage=''; hideCallPill(); }, 700);
}

function updateCallPill(){

/* 悬浮条拖动 */
(function setupPillDrag(){
  const pill = document.getElementById('callPill');
  let dragging=false, startX=0, startY=0, origLeft=0, origTop=0;
  pill.addEventListener('pointerdown', e=>{
    if (e.target.closest('.cp-btn')) return;
    dragging = true;
    const rect = pill.getBoundingClientRect();
    const phoneRect = document.getElementById('phone').getBoundingClientRect();
    origLeft = rect.left - phoneRect.left; origTop = rect.top - phoneRect.top;
    startX = e.clientX; startY = e.clientY;
    pill.style.left = origLeft+'px'; pill.style.top = origTop+'px'; pill.style.transform='none'; pill.style.right='auto';
    pill.setPointerCapture(e.pointerId);
  });
  pill.addEventListener('pointermove', e=>{
    if (!dragging) return;
    const dx = e.clientX-startX, dy = e.clientY-startY;
    const phoneRect = document.getElementById('phone').getBoundingClientRect();
    let nl = origLeft+dx, nt = origTop+dy;
    nl = Math.max(6, Math.min(phoneRect.width-100, nl));
    nt = Math.max(6, Math.min(phoneRect.height-60, nt));
    pill.style.left = nl+'px'; pill.style.top = nt+'px';
  });
  const endDrag = e=>{ dragging=false; };
  pill.addEventListener('pointerup', endDrag);
  pill.addEventListener('pointercancel', endDrag);
  pill.addEventListener('click', e=>{
    if (e.target.closest('.cp-btn')) return;
    if (Math.abs((e.clientX||0)-startX) < 4) showCallScreen();
  });
})();

let activeLetterFilter = 'all';

  document.querySelectorAll('#lettersFilter [data-letter-filter]').forEach(btn=>{

let lettersPageSize = 15;
let lettersShownCount = 15;
function renderLetters(){
  const list = document.getElementById('lettersList');
  renderLetterFilter();
  if (state.letters.length===0){
    list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-envelope"></i><div>还没有信件往来，写一封信给对方吧</div></div>`;
    return;
  }
  const sorted = [...state.letters]
    .filter(l => activeLetterFilter==='all'
      || (activeLetterFilter==='sent' && l.from==='me')
      || (activeLetterFilter==='received' && l.from==='partner')
      || (activeLetterFilter==='reply' && l.from==='me' && l.status==='replied'))
    .sort((a,b)=> b.time - a.time);

  if (!sorted.length){
    list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-envelope"></i><div>${activeLetterFilter==='sent'?'还没有寄出的信':activeLetterFilter==='reply'?'还没有回信':'还没有收到的信'}</div></div>`;
    return;
  }

  const visible = sorted.slice(0, lettersShownCount);
  const hasMore = sorted.length > visible.length;
  list.innerHTML = visible.map(letterHTML).join('') + (hasMore ? `<button class="mini" id="lettersLoadMoreBtn" style="width:100%;justify-content:center;margin-top:6px;">加载更多（还有 ${sorted.length - visible.length} 封）</button>` : '');
  list.querySelectorAll('.letter-card').forEach(card=>{
    card.addEventListener('click', ()=>openLetterDetail(card.dataset.id));
  });
  const moreBtn = document.getElementById('lettersLoadMoreBtn');
  if (moreBtn) moreBtn.addEventListener('click', ()=>{ lettersShownCount += lettersPageSize; renderLetters(); });
}

async function sendLetter(){
  const val = document.getElementById('letterInput').value.trim();
  if (!val) return;
  const waitingPhrase = LETTER_WAIT_PHRASES[randInt(0,LETTER_WAIT_PHRASES.length-1)];
  const letter = { id:'l'+Date.now(), from:'me', text:val, time:Date.now(), status:'sent', waitingPhrase };

function scheduleLetterReply(id){
  const s = state.settings;
  const lo = Math.min(s.letterReplyMinMinutes, s.letterReplyMaxMinutes);
  const hi = Math.max(s.letterReplyMinMinutes, s.letterReplyMaxMinutes);
  const delayMin = randInt(lo, hi);
  setTimeout(async ()=>{
    const letter = state.letters.find(l=>l.id===id);
    if (!letter) return;
    letter.status = 'replied';
    letter.replyText = pickCardsWithReplacement(s.letterCardCount);
    letter.replyTime = Date.now();
    await saveAll(); renderLetters();
    const preview = letter.replyText.length>40 ? letter.replyText.slice(0,40)+'…' : letter.replyText;
    showPopup(nameOf('partner')+'回信了', preview, 'fa-envelope');
  }, delayMin*60*1000);
}

function postHTML(p, showReplyContext){
  const author = p.author === 'me' ? state.me : state.partner;
  const likedBy = p.likedBy || [];
  const totalLikes = (p.baseLikes||0) + likedBy.length;
  const myLiked = likedBy.includes('me');
  const replyBlocks = (p.replies||[]).map((r,ridx)=>{
    const bubbleClass = r.from === 'me' ? 'sent' : 'recv';
    let inner = '';
    if (r.pending) inner = `<div class="bubble ${bubbleClass}">对方正在输入…</div>`;
    else if (r.readOnly) inner = `<div class="reply-meta"><i class="fa-solid fa-eye"></i> 对方已读，但没有回复</div>`;
    else {
      const replyToTag = r.replyToName ? `<div class="reply-meta" style="margin-bottom:2px;">回复 @${escapeHTML(r.replyToName)}</div>` : '';
      inner = replyToTag + (r.sticker?`<img class="psticker" style="margin:0 0 6px" src="${r.sticker}" data-imgzoom="${r.sticker}">`:'') + (r.text?`<div class="bubble ${bubbleClass}">${escapeHTML(r.text)}</div>`:'');
    }
    return `<div class="reply-block" data-ridx="${ridx}" style="${r.pending||r.readOnly?'':'cursor:pointer;'}"><img class="ava" src="${avatarOf(r.from)}"><div style="flex:1">${inner}<div class="reply-meta" style="margin-top:4px;">${r.pending?'':fmtTime(r.time)}</div></div></div>`;
  }).join('');
  const contextLine = showReplyContext ? `<div class="reply-context">回复了 ${escapeHTML(author.name)} 的动态</div>` : '';
  return `<div class="post" data-id="${p.id}">
    ${contextLine}
    <div class="phead">
      <img src="${avatarOf(p.author)}">
      <div><div class="who">${escapeHTML(author.name)}</div><div class="when">${fmtTime(p.time)}</div></div>
      ${p.pinned ? `<div class="pin-tag"><i class="fa-solid fa-thumbtack"></i>置顶</div>` : ''}
    </div>
    ${p.text ? `<div class="ptext">${escapeHTML(p.text)}</div>` : ''}
    ${p.image ? `<img class="pimg" src="${p.image}" data-imgzoom="${p.image}">` : ''}
    <div class="pfoot">
      <span class="like-btn ${myLiked?'liked':''}" data-postid="${p.id}"><i class="fa-solid fa-heart"></i> ${totalLikes}</span>
      <span class="reply-btn" data-postid="${p.id}"><i class="fa-solid fa-comment"></i> ${(p.replies||[]).length}</span>
      <span><i class="fa-solid fa-share-nodes"></i></span>
    </div>
    <div class="reply-input-row" data-postid="${p.id}" style="display:none;">
      <input type="text" placeholder="写下你的回复…">
      <button>发送</button>
    </div>
    ${replyBlocks}
  </div>`;
}
function bindPostInteractions(root){
  root.querySelectorAll('.like-btn').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const post = state.posts.find(p=>p.id===el.dataset.postid);
      if (!post) return;
      post.likedBy = post.likedBy || [];
      const idx = post.likedBy.indexOf('me');
      if (idx>-1) post.likedBy.splice(idx,1); else post.likedBy.push('me');
      await saveAll(); renderProfileTab();
    });
  });
  root.querySelectorAll('.reply-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const row = root.querySelector(`.reply-input-row[data-postid="${el.dataset.postid}"]`);
      if (row) row.style.display = row.style.display==='none' ? 'flex' : 'none';
    });
  });
  root.querySelectorAll('.reply-input-row').forEach(row=>{
    row.querySelector('button').addEventListener('click', async ()=>{
      const input = row.querySelector('input');
      const text = input.value.trim();
      if (!text) return;
      const post = state.posts.find(p=>p.id===row.dataset.postid);
      if (!post) return;
      post.replies = post.replies || [];
      post.replies.push({ from:'me', text, time:Date.now() });
      input.value='';
      await saveAll(); renderProfileTab();
      
      // 触发对方回复评论
      const chance = state.settings.readNoReply ? (100 - state.settings.noReplyChance) : 100;
      if(Math.random() * 100 < chance) {
        setTimeout(async () => {
          post.replies.push({ from:'partner', text:generateReplyText(), time:Date.now() });
          await saveAll();
          if (document.querySelector('.tab-btn.active')?.dataset.view==='profile') renderProfileTab();
        }, randInt(state.settings.minDelay, state.settings.maxDelay) * 1000);
      }
    });
  });
  // 点击某一条回复，可以针对这条回复再回复（楼中楼）
  root.querySelectorAll('.reply-block').forEach(block=>{
    const postEl = block.closest('.post');
    if (!postEl) return;
    const postId = postEl.dataset.id;
    const post = state.posts.find(p=>p.id===postId);
    if (!post) return;
    const ridx = +block.dataset.ridx;
    const r = (post.replies||[])[ridx];
    if (!r || r.pending || r.readOnly) return;
    block.addEventListener('click', ()=>{
      const replyToName = nameOf(r.from);
      promptModal(`回复 @${replyToName}`, '写下你的回复…', async val=>{
        const text = (val||'').trim();
        if (!text) return;
        post.replies = post.replies || [];
        post.replies.push({ from:'me', text, replyToName, time:Date.now() });
        await saveAll(); renderProfileTab();
        maybeReplyToPost(post.id);
      });
    });
  });
}

function maybeReplyToPost(postId){
  const chance = state.settings.readNoReply ? (100 - state.settings.noReplyChance) : 100;
  const willReply = Math.random()*100 < chance;
  const delayMs = randInt(state.settings.minDelay, state.settings.maxDelay) * 1000;
  const post = state.posts.find(p=>p.id===postId);
  if (!post) return;
  if (!willReply) return;
  const pendingReply = { from:'partner', pending:true, time:Date.now() };
  post.replies.push(pendingReply);
  if (document.querySelector('.tab-btn.active')?.dataset.view==='profile') renderProfileTab();
  setTimeout(async ()=>{
    const idx = post.replies.indexOf(pendingReply);
    const finalReply = { from:'partner', text:generateReplyText(), sticker:maybeSticker(), time:Date.now() };
    if (idx>-1) post.replies[idx] = finalReply; else post.replies.push(finalReply);
    await saveAll();
    if (document.querySelector('.tab-btn.active')?.dataset.view==='profile') renderProfileTab();
    notify(nameOf('partner')+'回复了你的动态');
  }, delayMs);
}
function schedulePartnerLike(postId){
  const s = state.settings;
  if (Math.random()*100 >= s.partnerLikeChance) return;
  const delayMs = randInt(s.partnerLikeDelayMin, s.partnerLikeDelayMax) * 60 * 1000;
  setTimeout(async ()=>{
    const post = state.posts.find(p=>p.id===postId);
    if (!post) return;
    post.likedBy = post.likedBy || [];
    if (!post.likedBy.includes('partner')) post.likedBy.push('partner');
    await saveAll();
    if (document.querySelector('.tab-btn.active')?.dataset.view==='profile') renderProfileTab();
    notify(nameOf('partner')+'赞了你的动态');
  }, delayMs);
}

async function switchCharacter(id){
  if (id===state.activeCharacterId) return;
  if (callState !== 'idle'){ endCall('通话已结束'); hideCallPill(); }
  showLoading('正在切换角色...');
  
  // 异步执行避免阻塞 UI 渲染 Loading
  setTimeout(async () => {
    const idx = state.characters.findIndex(c=>c.id===state.activeCharacterId);
    if (idx>-1) state.characters[idx] = activeCharacterSnapshot();
    const target = state.characters.find(c=>c.id===id);
    if (!target) { hideLoading(); return; }
    
    loadCharacterInto(target);
    lastRenderedMsgCount = state.messages.length; // 切换角色后是全新的一屏，不要整段动画
    await saveAll();
    applyTheme(); renderAll(); setupStatusTimer();
    hideLoading();
    toast('已切换到 '+state.partner.name);
  }, 100);
}

function setupSettingsCategories(){
  const view=document.getElementById('view-settings'); if(!view)return;
  const groups=[...view.querySelectorAll('.settings-group')];
  const cats=[
    ['appearance','外观'],['chat','聊天'],['library','字卡 / 素材'],['dynamic','动态'],['group','群聊'],['music','一起听歌'],['call','电话 / 红包'],['letters','信件'],['system','角色 / 系统']
  ];
  const nav=document.createElement('div');nav.className='settings-category-nav';
  nav.innerHTML=cats.map(([id,label],i)=>`<button type="button" data-setting-cat-btn="${id}" class="${i===0?'active':''}">${label}</button>`).join('');
  view.insertBefore(nav,view.firstChild);
  const catForTitle=t=>{
    if(t.includes('外观'))return'appearance';
    if(t.includes('字卡')||t.includes('表情包')||t.includes('图片库')||t==='状态')return'library';
    if(t.includes('动态'))return'dynamic';
    if(t.includes('群聊'))return'group';
    if(t.includes('一起听歌'))return'music';
    if(t.includes('电话')||t.includes('红包'))return'call';
    if(t.includes('信')||t.includes('写信'))return'letters';
    if(t.includes('角色')||t.includes('系统')||t.includes('数据')||t.includes('存储'))return'system';
    if(t.includes('聊天')||t.includes('主动消息'))return'chat';
    return'chat';
  };
  groups.forEach(g=>{const title=g.querySelector('h3')?.textContent||'';g.dataset.settingCat=catForTitle(title);});
  const activate=id=>{nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.settingCatBtn===id));groups.forEach(g=>g.hidden=g.dataset.settingCat!==id);};
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>activate(b.dataset.settingCatBtn));
  activate('appearance');
}

let cardSelections = new Set();
function renderCardList(){
  const box = document.getElementById('cardListBox');
  if (!box) return;
  box.innerHTML = state.cards.map((c,i)=>`<div class="ci"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="card-cb" data-i="${i}" ${cardSelections.has(i)?'checked':''}><span>${escapeHTML(c)}</span></label><button data-i="${i}"><i class="fa-solid fa-trash"></i></button></div>`).join('') || `<div class="ci" style="color:var(--muted)">暂无字卡</div>`;
  
  const updateBatchBtn = () => {
    const row = document.getElementById('batchDelCardsRow');
    const cnt = document.getElementById('cardSelCount');
    if(cardSelections.size > 0) { row.style.display = 'flex'; cnt.textContent = cardSelections.size; }
    else { row.style.display = 'none'; }
  };
  
  box.querySelectorAll('.card-cb').forEach(cb => {
    cb.addEventListener('change', e => {
      if(e.target.checked) cardSelections.add(+cb.dataset.i);
      else cardSelections.delete(+cb.dataset.i);
      updateBatchBtn();
    });
  });
  
  box.querySelectorAll('button[data-i]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{ 
      state.cards.splice(+btn.dataset.i,1); 
      cardSelections.clear();
      await saveAll(); renderSettings(); 
    });
  });
  updateBatchBtn();
}

function renderPokeList(){
  const box = document.getElementById('pokeListBox');
  if (!box) return;
  box.innerHTML = state.pokes.map((c,i)=>`<div class="ci"><span>${escapeHTML(c)}</span><button data-i="${i}"><i class="fa-solid fa-trash"></i></button></div>`).join('') || `<div class="ci" style="color:var(--muted)">暂无拍一拍</div>`;
  box.querySelectorAll('button[data-i]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{ state.pokes.splice(+btn.dataset.i,1); await saveAll(); renderSettings(); });
  });
}

function renderCharList(){
  const box = document.getElementById('charListBox');
  if (box) {
    box.innerHTML = state.characters.map(c=>{
      const isActive = c.id===state.activeCharacterId;
      const p = isActive ? state.partner : c.partner;
      return `<div class="char-item ${isActive?'active':''}" data-id="${c.id}">
        <img src="${p.avatar||AVATAR_PLACEHOLDER}">
        <div class="ci-name">${escapeHTML(c.label)}<div style="font-weight:400;color:var(--muted);font-size:11px;">${escapeHTML(p.name)}</div></div>
        <div class="ci-actions">
          ${isActive ? `<span class="ci-current"><i class="fa-solid fa-circle-check"></i>当前</span>` : `<button class="ci-icon-btn" data-act="switch" title="切换到该角色"><i class="fa-solid fa-right-left"></i></button>`}
          <button class="ci-icon-btn" data-act="edit" title="编辑角色信息"><i class="fa-solid fa-pen"></i></button>
          ${state.characters.length>1 ? `<button class="ci-icon-btn danger" data-act="del" title="删除该角色"><i class="fa-solid fa-trash"></i></button>` : ''}
        </div>
      </div>`;
    }).join('');
    box.querySelectorAll('.char-item').forEach(el=>{
      const id = el.dataset.id;
      const switchBtn = el.querySelector('[data-act="switch"]');
      if (switchBtn) switchBtn.addEventListener('click', (e)=>{ e.stopPropagation(); switchCharacter(id); });
      const editBtn = el.querySelector('[data-act="edit"]');
      if (editBtn) editBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openEditCharacterSheet(id); });
      const delBtn = el.querySelector('[data-act="del"]');
      if (delBtn) delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); confirmModal('删除该角色及其全部聊天记录？此操作不可撤销。', ()=> deleteCharacter(id)); });
      // 整行点击也可切换
      el.addEventListener('click', ()=>{ if (id !== state.activeCharacterId) switchCharacter(id); });
    });
  }
}
function openEditCharacterSheet(id){
  const isActive = id===state.activeCharacterId;

    <div class="sheet-btn-row">

  `, ()=>{

      const newLabel = document.getElementById('ec_label').value.trim();

function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function storageSizeOf(obj){
  try{ return new Blob([JSON.stringify(obj) || '']).size; }catch(e){ return 0; }
}
function computeStorageBreakdown(){
  const idx = state.characters.findIndex(c=>c.id===state.activeCharacterId);
  const chars = state.characters.map((c,i)=> i===idx ? activeCharacterSnapshot() : c);
  let messagesSize=0, postsSize=0, lettersSize=0, identitySize=0;
  chars.forEach(c=>{
    messagesSize += storageSizeOf(c.messages||[]);
    postsSize += storageSizeOf(c.posts||[]);
    lettersSize += storageSizeOf(c.letters||[]);
    identitySize += storageSizeOf(c.me) + storageSizeOf(c.partner);
  });
  const cardsSize = storageSizeOf(state.cards) + storageSizeOf(state.pokes) + storageSizeOf(state.partnerStatusList);
  const stickerSize = storageSizeOf(state.stickers) + storageSizeOf(state.kaomoji);
  const libSize = storageSizeOf(state.imageLibrary);
  const groupSize = storageSizeOf(state.groupChats) + storageSizeOf(state.groupMessages);
  const musicSize = storageSizeOf(state.playlist);
  const rows = [
    { label:'聊天记录', value:messagesSize, color:'#3d5cff' },
    { label:'头像 / 背景图', value:identitySize, color:'#ff6f91' },
    { label:'图片库', value:libSize, color:'#ff9a5a' },
    { label:'动态', value:postsSize, color:'#34c759' },
    { label:'群聊', value:groupSize, color:'#8e5cff' },
    { label:'音乐歌单', value:musicSize, color:'#00c2b8' },
    { label:'贴纸 / 颜文字', value:stickerSize, color:'#ffcc00' },
    { label:'信件', value:lettersSize, color:'#5ac8fa' },
    { label:'字卡 / 状态 / 拍一拍', value:cardsSize, color:'#8a8f98' }
  ].filter(r=>r.value>0).sort((a,b)=>b.value-a.value);
  const total = rows.reduce((s,r)=>s+r.value,0);
  return { rows, total };
}
function formatStorageBytes(n){
  if (n<1024) return n+' B';
  if (n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(2)+' MB';
}
function renderStorageChart(){
  const box = document.getElementById('storageChartBox');
  if (!box) return;
  const { rows, total } = computeStorageBreakdown();
  if (!total){ box.innerHTML = `<div style="font-size:12px;color:var(--muted);text-align:center;padding:6px;">还没有可统计的数据</div>`; return; }
  box.innerHTML = `
    <div class="storage-bar">${rows.map(r=>`<div style="width:${(r.value/total*100).toFixed(2)}%;background:${r.color}" title="${r.label}"></div>`).join('')}</div>
    <div class="storage-legend">${rows.map(r=>`<div class="storage-legend-item"><span class="dot" style="background:${r.color}"></span>${r.label}<b>${formatStorageBytes(r.value)}</b></div>`).join('')}</div>
    <div class="storage-total">当前数据总量约 ${formatStorageBytes(total)}（含所有角色，估算值，不含浏览器自身开销）</div>
  `;
}

async function removeDeadStickerLinks(){

let musicAudio=null, musicBehaviorTimer=null, musicInviteTimer=null, musicPendingInvite=null;
function musicEnsure(){if(!state.playlist)state.playlist=[];if(!state.music)state.music={currentIndex:0,mode:'sequence',together:false,playing:false,liked:false,position:0};if(!musicAudio){musicAudio=new Audio();musicAudio.preload='metadata';musicAudio.addEventListener('timeupdate',()=>{state.music.position=musicAudio.currentTime;const p=document.getElementById('musicProgress');if(p&&musicAudio.duration)p.value=(musicAudio.currentTime/musicAudio.duration)*100;const c=document.getElementById('musicCurrent');if(c)c.textContent=musicFmt(musicAudio.currentTime);});musicAudio.addEventListener('loadedmetadata',()=>{const d=document.getElementById('musicDuration');if(d)d.textContent=musicFmt(musicAudio.duration);});musicAudio.addEventListener('ended',()=>musicNext(true));}}
function musicFmt(sec){if(!isFinite(sec))return '0:00';sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
function musicCurrent(){return state.playlist[state.music.currentIndex]||null;}
function musicEscape(v){return escapeHTML(String(v||''));}
function musicBubble(){const text=state.cards.length?state.cards[randInt(0,state.cards.length-1)]:'未知';const b=document.getElementById('musicBubble');if(b){b.textContent=text;b.animate([{opacity:.3,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'},{opacity:1},{opacity:.5}],{duration:1800});}}
function musicOpen(){musicEnsure();musicRender();document.getElementById('musicPanel').classList.add('show');document.getElementById('musicPanel').setAttribute('aria-hidden','false');}
function musicClose(){document.getElementById('musicPanel').classList.remove('show');document.getElementById('musicPanel').setAttribute('aria-hidden','true');}
async function musicPlay(){musicEnsure();if(!musicCurrent()){toast('先添加一首歌','fa-music');musicOpen();return;}if(musicCurrent().type==='netease'){state.music.playing=true;document.getElementById('musicFloat').classList.add('playing');musicScheduleBehavior();musicRender();await saveAll();return;}try{if(!musicAudio.src||musicAudio.src!==musicCurrent().src)musicAudio.src=musicCurrent().src;await musicAudio.play();state.music.playing=true;state.music.position=musicAudio.currentTime;document.getElementById('musicFloat').classList.add('playing');musicScheduleBehavior();musicRender();await saveAll();}catch(e){toast('这首歌无法播放，请重新导入音频','fa-triangle-exclamation');}}
function musicSeekRandom(){if(musicAudio?.duration)musicAudio.currentTime=Math.random()*musicAudio.duration;musicBubble();}
function musicScheduleBehavior(){clearTimeout(musicBehaviorTimer);if(!state.music.playing)return;const lo=Math.max(1,+state.settings.musicCheckMin||5),hi=Math.max(lo,+state.settings.musicCheckMax||15);musicBehaviorTimer=setTimeout(()=>{musicPartnerBehavior();musicScheduleBehavior();},randInt(lo,hi)*1000);}
function musicChance(key){return Math.random()*100<Math.max(0,Math.min(100,+state.settings[key]||0));}

function parseNeteaseShareText(raw){

async function fetchNeteaseMeta(id){
  if(!id) return {};
  if(NETEASE_META_CACHE[id]) return NETEASE_META_CACHE[id];
  const endpoints=[`https://music.163.com/api/song/detail?ids=[${id}]`,`https://music.163.com/api/v3/song/detail?c=[{\"id\":${id}}]`];
  for(const ep of endpoints){
    try{const r=await fetch(ep,{headers:{Accept:'application/json'}});if(!r.ok)continue;const j=await r.json();const song=j.songs?.[0]||j.data?.songs?.[0];if(song){const meta={title:song.name||'',artist:(song.ar||[]).map(a=>a.name).filter(Boolean).join(', '),album:song.al?.name||''};NETEASE_META_CACHE[id]=meta;return meta;}}catch(e){}

}

function parseAudioFilenameMeta(url){
  try{
    const clean = url.split('?')[0].split('#')[0];
    const name = decodeURIComponent(clean.substring(clean.lastIndexOf('/')+1));
    const withoutExt = name.replace(/\.(mp3|m4a|wav|flac|ogg|aac)$/i,'');
    const stripped = withoutExt.replace(/^\d{6,}[_\-]/,'');
    const m = stripped.match(/^(.+?)[_\s]*-[_\s]*(.+)$/);
    if (m) return { artist: m[1].replace(/_/g,' ').trim(), title: m[2].replace(/_/g,' ').trim() };
    return { title: stripped.replace(/_/g,' ').trim(), artist:'' };
  }catch(e){ return {title:'', artist:''}; }
}
function isDirectAudioUrl(url){

function groupRenderMessages(g, animateCount=0){
  const box=document.getElementById('groupMessages');
  if(!box)return;
  const msgs=state.groupMessages.filter(m=>m.groupId===g.id).sort((a,b)=>a.time-b.time);
  box.innerHTML=msgs.length?msgs.map(m=>{
    const me=m.from==='user';
    const member=g.members.find(x=>x.roleId===m.from);
    const c=member?state.characters.find(x=>x.id===member.roleId):null;
    const ava=me?(state.me.avatar||AVATAR_PLACEHOLDER):(member?.avatar||c?.partner.avatar||AVATAR_PLACEHOLDER);
    const nick=me?'我':(member?.nickname||c?.partner.name||'成员');
    const rowClass = me ? 'me' : 'partner';
    let inner = '';
    if (m.file){
      inner = `<div class="chat-bubble file ${me?'sent':'recv'}" data-mid="${m.id}"><div class="file-icon"><i class="fa-solid fa-file"></i></div><div class="file-name">${escapeHTML(m.file.name)}</div></div>`;
    } else {
      const parts = [];
      if (m.image) parts.push(`<img class="cr-img" src="${m.image}" data-imgzoom="${m.image}">`);
      if (m.video) parts.push(`<video class="cr-video" controls src="${m.video}"></video>`);
      if (m.sticker) parts.push(`<img class="cr-sticker" src="${m.sticker}" data-imgzoom="${m.sticker}">`);
      if (m.text) parts.push(`<div class="chat-bubble ${me?'sent':'recv'}">${escapeHTML(m.text)}</div>`);
      inner = parts.join('');
    }
    const readLine = m.readStatus==='no_reply' ? `<div class="cr-readonly">${escapeHTML(nick)} 已读</div>` : '';
    return `<div class="chat-row ${rowClass}" data-id="${m.id}">
      <img class="cr-ava" src="${ava}">
      <div class="cr-col"><div class="group-sender">${escapeHTML(nick)}</div>${inner}${readLine}</div>
    </div>`;
  }).join(''):`<div class="chat-empty"><i class="fa-solid fa-comment-dots"></i><div>还没有群消息</div></div>`;
  const prevCount = lastRenderedGroupMsgCount[g.id] || 0;
  const autoCount = Math.max(0, msgs.length - prevCount);
  const effectiveCount = Math.max(animateCount, autoCount);
  if (effectiveCount > 0) {
    const rows = box.querySelectorAll('.chat-row');
    const from = Math.max(0, rows.length - effectiveCount);
    for (let i = from; i < rows.length; i++) {
      rows[i].classList.add('msg-enter');
      rows[i].style.animationDelay = ((i - from) * 0.05) + 's';
    }
  }
  lastRenderedGroupMsgCount[g.id] = msgs.length;
  box.scrollTop=box.scrollHeight;
}

(function runFatesSplash(){
  const splash = document.getElementById('splash-fates');
  if (!splash) return;
  // 硬性兜底：不管动画内部发生什么（报错/元素没就绪/浏览器兼容问题），
  // 最多 8 秒后一定强制移除开场动画，绝对不能把用户卡在这一屏进不去。
  let done = false;
  const forceRemove = ()=>{ if (done) return; done = true; splash.remove(); };
  const hardTimeout = setTimeout(forceRemove, 8000);
  try {
    const container = document.getElementById('fates-container');
    const pathL = document.getElementById('path-l');
    const pathR = document.getElementById('path-r');
    const ripple = document.getElementById('ripple');
    const status = document.getElementById('fates-status');
    const brandTitle = document.getElementById('brand-title');
    const lenL = pathL.getTotalLength() || 400;
    const lenR = pathR.getTotalLength() || 400;
    pathL.style.strokeDasharray = lenL; pathL.style.strokeDashoffset = lenL;
    pathR.style.strokeDasharray = lenR; pathR.style.strokeDashoffset = lenR;
    let progress = 0, isStuck = false, hasBroken = false;
    const texts = { 0:"Fates intertwining...", 40:"Tying the knot...", 80:"Pulling tight...", 86:"Through the void...", 95:"Inseparable." };
    function load(){
      try {
        if (progress >= 100){
          container.classList.add('tighten');
          brandTitle.classList.remove('tension'); brandTitle.classList.add('burst');
          status.classList.remove('tension'); status.classList.add('burst');
          status.innerText = "Bound Forever.";
          setTimeout(()=>{
            if (done) return;
            splash.classList.add('splash-exit');
            setTimeout(()=>{ clearTimeout(hardTimeout); forceRemove(); }, 1000);
          }, 1800);
          return;
        }
        let inc = 0, tick = 30;
        if (progress < 60){ inc = Math.random()*2.5+1; tick = 30; }
        else if (progress < 80){ inc = Math.random()*1.5+0.5; tick = 40; }
        else if (progress >= 80 && progress < 85){
          if (!isStuck){ isStuck = true; tick = 800; inc = 0.02; container.classList.add('struggling'); container.classList.add('flattened'); brandTitle.classList.add('tension'); status.classList.add('tension'); }
          else { inc = 0.04; tick = 30; }
        } else if (progress >= 85 && progress < 100){
          if (!hasBroken){ hasBroken = true; container.classList.remove('struggling'); ripple.classList.add('burst'); inc = 4; tick = 20; }
          else { inc = 6; tick = 20; }
        }
        progress = Math.min(progress + inc, 100);
        pathL.style.strokeDashoffset = lenL - (progress/100)*lenL;
        pathR.style.strokeDashoffset = lenR - (progress/100)*lenR;
        if (progress < 100 && !isStuck){
          const keys = Object.keys(texts).map(Number).sort((a,b)=>b-a);
          for (let k of keys){ if (progress >= k){ status.innerText = texts[k]; break; } }
        } else if (isStuck && progress < 85){
          status.innerText = "Pulling tight...";
        }
        setTimeout(load, tick);
      } catch(e){ clearTimeout(hardTimeout); forceRemove(); }
    }
    setTimeout(load, 600);
  } catch(e){ clearTimeout(hardTimeout); forceRemove(); }
})();

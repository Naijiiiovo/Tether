  const list=document.getElementById('musicPlaylist'),wrap=document.getElementById('musicPlaylistWrap'),count=document.getElementById('musicPlaylistCount');if(count)count.textContent=`${state.playlist.length} 首`;
  if(list)list.innerHTML=state.playlist.length?state.playlist.map((x,i)=>`<div class="music-track ${i===state.music.currentIndex?'active':''}" data-mi="${i}"><i class="fa-solid fa-music"></i><div class="music-track-info"><div class="music-track-title">${musicEscape(x.title||'未知歌曲')}</div><div class="music-track-artist">${musicEscape(x.artist||'未知歌手')}</div></div><button data-edit-mi="${i}" title="编辑"><i class="fa-solid fa-pen"></i></button><button data-del-mi="${i}" title="删除"><i class="fa-solid fa-trash"></i></button></div>`).join(''):`<div style="font-size:11px;color:var(--muted);text-align:center;padding:15px">还没有歌曲</div>`;
  list?.querySelectorAll('[data-mi]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-edit-mi],[data-del-mi]'))return;musicLoad(+el.dataset.mi,true)});list?.querySelectorAll('[data-edit-mi]').forEach(b=>b.onclick=e=>{e.stopPropagation();musicEditTrack(+b.dataset.editMi)});list?.querySelectorAll('[data-del-mi]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const i=+b.dataset.delMi;state.playlist.splice(i,1);if(state.music.currentIndex>=state.playlist.length)state.music.currentIndex=Math.max(0,state.playlist.length-1);if(!state.playlist.length&&musicAudio)musicAudio.pause();await saveAll();musicRender();renderMusicSettings();});
}
async function musicLoad(i,autoplay){musicEnsure();if(!state.playlist[i])return;state.music.currentIndex=i;state.music.position=0;const tr=state.playlist[i];if(tr.type==='netease'){if(!tr.neteaseId)tr.neteaseId=extractNeteaseId(tr.url||tr.src||'');if(!tr.neteaseId&&tr.url?.includes('163cn.tv/bfC6ZgHC'))tr.neteaseId='2122127826';if(tr.neteaseId&&!tr.lyrics){tr.lyrics=await fetchNeteaseLyrics(tr.neteaseId);}if(musicAudio)musicAudio.pause();state.music.playing=!!autoplay;musicRender();await saveAll();return;}if(musicAudio){musicAudio.src=tr.src||'';musicAudio.currentTime=0;}musicRender();if(autoplay)await musicPlay();else await saveAll();}
async function musicPlay(){musicEnsure();if(!musicCurrent()){toast('先添加一首歌','fa-music');musicOpen();return;}const tr=musicCurrent();if(tr.type==='netease'){if(!tr.neteaseId)tr.neteaseId=extractNeteaseId(tr.url||tr.src||'');if(!tr.neteaseId&&tr.url?.includes('163cn.tv/bfC6ZgHC'))tr.neteaseId='2122127826';if(!tr.neteaseId){toast('这个网易云链接没有识别到歌曲 ID，请把网易云分享文字一起粘贴。','fa-triangle-exclamation');return;}state.music.playing=true;document.getElementById('musicFloat')?.classList.add('playing');musicRender();musicScheduleBehavior();await saveAll();return;}try{if(!musicAudio.src||musicAudio.src!==tr.src)musicAudio.src=tr.src;await musicAudio.play();state.music.playing=true;state.music.position=musicAudio.currentTime;document.getElementById('musicFloat').classList.add('playing');musicScheduleBehavior();musicRender();await saveAll();}catch(e){state.music.playing=false;document.getElementById('musicFloat')?.classList.remove('playing');musicRender();toast('这首本地歌曲无法播放，请重新导入音频。','fa-triangle-exclamation');}}
function musicPause(byPartner=false){if(musicAudio)musicAudio.pause();state.music.playing=false;document.getElementById('musicFloat')?.classList.remove('playing');musicRender();saveAll();if(byPartner){musicBubble();showPopup('对方暂停了歌曲',state.cards.length?state.cards[randInt(0,state.cards.length-1)]:'未知','fa-pause');}}
function musicNext(auto=false,byPartner=false){if(!state.playlist.length)return;if(state.music.mode==='single'){if(musicAudio){musicAudio.currentTime=0;if(state.music.playing||auto)musicAudio.play().catch(()=>{});}if(byPartner)showPopup('对方切换了歌曲',musicCurrent()?.title||'未知歌曲','fa-forward-step');return;}let i=state.music.currentIndex;if(state.music.mode==='random'){if(state.playlist.length>1){do{i=randInt(0,state.playlist.length-1)}while(i===state.music.currentIndex);}}else i=(i+1)%state.playlist.length;musicLoad(i,state.music.playing||auto);if(state.music.together)musicBubble();if(byPartner)showPopup('对方切换了歌曲',musicCurrent()?.title||'未知歌曲','fa-forward-step');}
function musicPrev(){if(!state.playlist.length)return;state.music.currentIndex=(state.music.currentIndex-1+state.playlist.length)%state.playlist.length;state.music.position=0;musicLoad(state.music.currentIndex,state.music.playing);}
function musicModeToggle(){state.music.mode=state.music.mode==='sequence'?'single':state.music.mode==='single'?'random':'sequence';musicRender();musicBubble();saveAll();}
function initMusic(){musicEnsure();const f=document.getElementById('musicFileInput');if(f)f.onchange=async e=>{const files=[...e.target.files];if(files.length)await importMusicFiles(files);e.target.value='';};document.getElementById('musicClose').onclick=musicClose;document.getElementById('musicPlayBtn').onclick=()=>state.music.playing?musicPause():musicPlay();document.getElementById('musicPrevBtn').onclick=musicPrev;document.getElementById('musicNextBtn').onclick=()=>musicNext();document.getElementById('musicLikeBtn').onclick=async()=>{state.music.liked=!state.music.liked;musicRender();await saveAll();};document.getElementById('musicModeBtn').onclick=musicModeToggle;document.getElementById('musicInviteBtn').onclick=musicConfirmInvite;document.getElementById('musicProgress').oninput=e=>{if(musicAudio?.duration)musicAudio.currentTime=(+e.target.value/100)*musicAudio.duration;};const pt=document.getElementById('musicPlaylistToggle');if(pt)pt.onclick=()=>document.getElementById('musicPlaylistWrap')?.classList.toggle('collapsed');const mr=document.getElementById('musicExternalReload');if(mr)mr.onclick=()=>{const tr=musicCurrent();if(tr?.type==='netease'&&tr.neteaseId){const f=document.getElementById('musicExternalFrame');if(f)f.src=`https://music.163.com/outchain/player?type=2&id=${tr.neteaseId}&auto=${state.music.playing?'1':'0'}&height=86`;}};const ball=document.getElementById('musicFloat');let drag=false,moved=false,sx=0,sy=0,ox=0,oy=0;ball.addEventListener('pointerdown',e=>{drag=true;moved=false;sx=e.clientX;sy=e.clientY;const r=ball.getBoundingClientRect();ox=r.left;oy=r.top;ball.setPointerCapture?.(e.pointerId);});ball.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>7)moved=true;if(!moved)return;const x=Math.max(4,Math.min(window.innerWidth-ball.offsetWidth-4,ox+dx)),y=Math.max(40,Math.min(window.innerHeight-ball.offsetHeight-8,oy+dy));ball.style.left=x+'px';ball.style.top=y+'px';ball.style.right='auto';ball.style.bottom='auto';});ball.addEventListener('pointerup',()=>{if(!drag)return;drag=false;localStorage.setItem('music_ball_pos',JSON.stringify({left:ball.style.left,top:ball.style.top}));if(!moved){if(document.getElementById('musicPanel').classList.contains('show'))musicClose();else musicOpen();}moved=false;});const pos=JSON.parse(localStorage.getItem('music_ball_pos')||'null');if(pos){ball.style.left=pos.left;ball.style.top=pos.top;ball.style.right='auto';ball.style.bottom='auto';}musicSetupProactiveInvite();musicRender();}
